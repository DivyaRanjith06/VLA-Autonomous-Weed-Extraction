[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weed-extraction"
version = "0.1.0"
description = "MuJoCo weed-extraction environment and launcher"
requires-python = ">=3.12"
# Exact pins, matching the Docker image, so every machine runs the same versions.
dependencies = [
    # The versions the tests and the generated dataset were verified on.
    "mujoco==3.13.0",
    # 1.3.0 needs mujoco 3.10 or newer.
    "mink==1.3.0",
    "gymnasium==1.3.0",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "draccus==0.11.6",
]

[project.optional-dependencies]
dev = ["pytest"]
# Dataset packing and SmolVLA training (weed_extraction.pack, .policy, .dataset). LeRobot
# itself is the submodule at workspace/planning/lerobot, installed with --no-deps (see
# run_scripts/setup.sh --smolvla); these are the libraries it and the pipeline use, pinned
# to the verified environment. LeRobot's own opencv-python-headless is left out: the
# opencv-python above already provides cv2.
smolvla = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchcodec==0.11.1; (sys_platform == 'linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64') or (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'win32'",
    "av==15.1.0",
    "datasets==4.8.5",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
    "jsonlines==4.0.0",
    "huggingface-hub==1.26.0",
    "transformers==5.5.4",
    "num2words==0.5.14",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "einops==0.8.2",
    "pillow==12.3.0",
    "requests==2.34.2",
    "termcolor==3.3.0",
    "tqdm==4.70.0",
    "packaging==25.0",
]

[project.scripts]
weed-launch = "weed_extraction.launch:main"

[tool.setuptools]
packages = ["weed_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
